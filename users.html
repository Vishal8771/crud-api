<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All User</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: lightgray;
        }
    </style>


</head>

<body>
    <h1>All Users</h1>

    <button onclick="getUsers()">
        Active Users
    </button>

    <button onclick="getDeletedUsers()">
        Deleted Users
    </button>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Password</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="userTable"></tbody>
    </table>


    <script>
        let isEditing = false;

        async function getUsers() {

            try {

                const response =
                    await fetch("http://localhost:5000/api/user");

                const result = await response.json();

                console.log(result);

                const tbody =
                    document.getElementById("userTable");

                tbody.innerHTML = "";

                result.data.forEach((user) => {

                    tbody.innerHTML += `
                <tr>
                    <td>${user.name}</td>
                    <td>${user.email}</td>
                    <td>${user.password}</td>
                    <td>
                        <button class="edit-btn"
                            onclick="editUser(this,'${user._id}')">
                            Edit
                        </button>

                        <button
                            onclick="deleteUser('${user._id}')">
                            Delete
                        </button>
                    </td>
                </tr>
            `;
                });

            } catch (error) {
                console.log(error);
            }
        }

        function updateUserInDatabase(id, name, password) {
            // Replace URL path structure matching your endpoint configured in Express routes
            fetch(`http://localhost:5000/api/update/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, password: password })
            })
                .then(res => res.json())
                .then(data => console.log("Database update successful:", data))
                .catch(err => console.error("Error updating user details:", err));
        }

        async function getDeletedUsers() {

            try {

                const response =
                    await fetch("http://localhost:5000/api/deleted-users");

                const result = await response.json();

                const tbody =
                    document.getElementById("userTable");

                tbody.innerHTML = "";

                result.data.forEach((user) => {

                    tbody.innerHTML += `
                <tr>
                    <td>${user.name}</td>
                    <td>${user.email}</td>
                    <td>${user.password}</td>
                    <td>
                        <button onclick="restoreUser('${user._id}')">
                            Restore
                        </button>
                    </td>
                </tr>
            `;
                });

            } catch (error) {
                console.log(error);
            }
        }

        async function restoreUser(id) {

            try {

                await fetch(
                    `http://localhost:5000/api/restore-user/${id}`,
                    {
                        method: "PUT"
                    }
                );

                alert("User Restored Successfully");

                getUsers();

            } catch (error) {
                console.log(error);
            }
        }

        async function deleteUser(id) {

            if (!confirm("Are you sure you want to delete this user?")) {
                return;
            }

            try {

                const response = await fetch(
                    `http://localhost:5000/api/user/${id}`,
                    {
                        method: "DELETE"
                    }
                );

                const result = await response.json();

                console.log(result);

                alert("User moved to Trash Successfully");

                getUsers();

            } catch (error) {
                console.log(error);
            }
        }

        function editUser(button, userId) {

            if (isEditing && button.innerText === "Edit") {
                return; // kuch nahi hoga
            }

            const row = button.parentElement.parentElement;

            const nameCell = row.cells[0];
            const passwordCell = row.cells[2];

            if (button.innerText === "Edit") {

                isEditing = true;

                // baaki Edit buttons disable
                document.querySelectorAll(".edit-btn").forEach(btn => {
                    if (btn !== button) {
                        btn.disabled = true;
                    }
                });

                const currentName = nameCell.innerText;
                const currentPassword = passwordCell.innerText;

                nameCell.innerHTML =
                    `<input type="text" value="${currentName}" id="edit-name-${userId}">`;

                passwordCell.innerHTML =
                    `<input type="text" value="${currentPassword}" id="edit-password-${userId}">`;

                button.innerText = "Save";

            } else {

                const newName =
                    document.getElementById(`edit-name-${userId}`).value;

                const newPassword =
                    document.getElementById(`edit-password-${userId}`).value;

                updateUserInDatabase(userId, newName, newPassword);

                nameCell.innerText = newName;
                passwordCell.innerText = newPassword;

                button.innerText = "Edit";

                isEditing = false;

                // sab Edit buttons enable
                document.querySelectorAll(".edit-btn").forEach(btn => {
                    btn.disabled = false;
                });
            }
        }
    </script>


</body>

</html>
